<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice City Cover Studio — turn any photo into a multi-panel GTA-style poster cover and export it as a PNG.">
<title>Vice City Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <section class="panel-controls" aria-label="Cover editor">
    <header>
      <h1>Vice City Cover Studio</h1>
      <p>Turn any photo into a multi-panel poster cover. Pick a layout, drop in
      photos, write a caption, export a PNG to share.</p>
    </header>

    <fieldset>
      <legend>Layout</legend>
      <div class="layout-row" id="layoutRow">
        <button type="button" data-layout="1" class="active">1 · Hero</button>
        <button type="button" data-layout="2">2 · Split</button>
        <button type="button" data-layout="3">3 · Triptych</button>
        <button type="button" data-layout="4">4 · Grid</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="grade-row" id="gradeRow">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="noir">Noir</button>
      </div>
    </fieldset>

    <label class="field">Title
      <input id="title" type="text" maxlength="36" value="Sunset Heist">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" maxlength="60" value="One last job under the neon sky">
    </label>

    <fieldset>
      <legend>Photos</legend>
      <label class="check"><input id="samePhoto" type="checkbox" checked>
        One photo across all panels</label>
      <div class="photo-slots" id="photoSlots"></div>
      <p class="hint">Drag on the preview to move a photo. Zoom and fit are per panel.</p>
    </fieldset>

    <label class="field">Export size
      <select id="exportSize">
        <option value="1080x1080" selected>Square · 1080 × 1080</option>
        <option value="1080x1350">Portrait · 1080 × 1350</option>
        <option value="1920x1080">Wide · 1920 × 1080</option>
      </select>
    </label>

    <button id="exportBtn" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="preview" aria-label="Live preview">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <p class="preview-note">Live preview — what you see is the exported cover.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
